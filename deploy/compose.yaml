services:
  mindflow:
    image: neokil/mindflow:edge
    build:
      context: ..
    ports:
      - "8080:8080"
    volumes:
      - mindflow-data:/data
    environment:
      MINDFLOW_ADDR: "0.0.0.0:8080"
      MINDFLOW_DATA: "/data"
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  mindflow-data:
