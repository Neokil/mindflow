# Replace the image registry and dataset path before installing this YAML.
# Build/push your own image from this repository; no public image is published yet.
services:
  mindflow:
    image: YOUR_REGISTRY/mindflow:0.1.0
    ports:
      - "8080:8080"
    volumes:
      - /mnt/POOL/apps/mindflow:/data
    environment:
      MINDFLOW_ADDR: "0.0.0.0:8080"
      MINDFLOW_DATA: "/data"
    user: "10001:10001"
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
