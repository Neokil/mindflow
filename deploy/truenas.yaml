# Create this dataset and grant UID/GID 568:568 read/write access.
# Shared settings keep the server and migration job on the same image and data.
x-mindflow: &mindflow
  image: neokil/mindflow:latest
  user: "568:568"
  pull_policy: always
  volumes:
    - type: bind
      source: /mnt/Pool1/Apps/Mindflow
      target: /data
      bind:
        create_host_path: false
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  migrate:
    <<: *mindflow
    command: [migrate]
    network_mode: none
    healthcheck:
      disable: true
  mindflow:
    <<: *mindflow
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports: ["30098:8080"]
    restart: unless-stopped
    stop_grace_period: 30s

# 0.0.0.0 is replaced by the TrueNAS address in the Apps UI.
x-portals:
  - name: Web UI
    host: 0.0.0.0
    port: 30098
    scheme: http
    path: /
