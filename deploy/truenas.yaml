# Replace the dataset path before installing this YAML.
# Use a published version tag for a stable deployment; edge follows main.
services:
  mindflow:
    image: neokil/mindflow:edge
    ports:
      - "8080:8080"
    volumes:
      - /mnt/POOL/apps/mindflow:/data
    environment:
      MINDFLOW_ADDR: "0.0.0.0:8080"
      MINDFLOW_DATA: "/data"
    user: "10001:10001"
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
