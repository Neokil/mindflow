version: "2"
sql:
  - engine: sqlite
    schema: internal/account/storage/migrations
    queries: internal/account/storage/queries
    gen:
      go:
        package: storage
        out: internal/account/storage
        output_db_file_name: sqlc_db.go
        output_models_file_name: sqlc_models.go
        emit_empty_slices: true
        omit_unused_structs: true
        overrides:
          - column: users.created_at
            go_type: int64
          - column: account_tokens.expires_at
            go_type: int64
          - column: sessions.expires_at
            go_type: int64
          - db_type: INTEGER
            go_type: int
  - engine: sqlite
    schema: internal/workspace/storage/migrations
    queries: internal/workspace/storage/queries
    gen:
      go:
        package: storage
        out: internal/workspace/storage
        output_db_file_name: sqlc_db.go
        output_models_file_name: sqlc_models.go
        emit_empty_slices: true
        omit_unused_structs: true
        overrides:
          - column: image_jobs.user_id
            go_type: string
          - column: image_jobs.asset_id
            go_type: string
          - column: image_jobs.dedup_key
            go_type: string
          - column: save_receipts.expires_at
            go_type: int64
          - column: page_leases.expires_at
            go_type: int64
          - column: page_leases.epoch
            go_type: int64
          - column: pages.updated_at
            go_type: int64
          - column: workspaces.updated_at
            go_type: int64
          - column: workspaces.created_at
            go_type: int64
          - column: assets.created_at
            go_type: int64
          - column: image_jobs.run_at
            go_type: int64
          - db_type: INTEGER
            go_type: int
  - engine: sqlite
    schema: internal/email/storage/migrations
    queries: internal/email/storage/queries
    gen:
      go:
        package: storage
        out: internal/email/storage
        output_db_file_name: sqlc_db.go
        output_models_file_name: sqlc_models.go
        emit_empty_slices: true
        omit_unused_structs: true
        overrides:
          - column: mail_jobs.user_id
            go_type: string
          - column: mail_jobs.dedup_key
            go_type: string
          - column: mail_jobs.run_at
            go_type: int64
          - db_type: INTEGER
            go_type: int
  - engine: sqlite
    schema: internal/installation/storage/migrations
    queries: internal/installation/storage/queries
    gen:
      go:
        package: storage
        out: internal/installation/storage
        output_db_file_name: sqlc_db.go
        output_models_file_name: sqlc_models.go
        emit_empty_slices: true
        omit_unused_structs: true
        overrides:
          - db_type: INTEGER
            go_type: int
