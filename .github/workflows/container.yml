name: Container verification
on:
  workflow_call:
permissions:
  contents: read
jobs:
  container:
    name: Production container, TLS and restore
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: make verify-container
