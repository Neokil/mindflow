name: CI
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "17 6 * * 1"
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}
jobs:
  quality:
    uses: ./.github/workflows/quality.yml
  browsers:
    uses: ./.github/workflows/browsers.yml
  container:
    uses: ./.github/workflows/container.yml
