name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}
jobs:
  quality:
    uses: ./.github/workflows/quality.yml
  browsers:
    uses: ./.github/workflows/browsers.yml
  container:
    uses: ./.github/workflows/container.yml
