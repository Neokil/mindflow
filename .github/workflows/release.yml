name: Publish release image
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  image:
    name: Publish Docker Hub image
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Validate version tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          if [[ "$RELEASE_TAG" == *-* ]]; then
            IFS=. read -ra identifiers <<< "${RELEASE_TAG#*-}"
            for identifier in "${identifiers[@]}"; do
              if [[ "$identifier" =~ ^[0-9]+$ && ${#identifier} -gt 1 && "$identifier" == 0* ]]; then
                echo "Numeric prerelease identifiers cannot have leading zeroes."
                exit 1
              fi
            done
          fi
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: metadata
        with:
          images: neokil/mindflow
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease && !contains(github.event.release.tag_name, '-') }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            MINDFLOW_RELEASE=${{ github.event.release.tag_name }}
          provenance: mode=max
          sbom: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
