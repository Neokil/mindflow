  "components": {
    "securitySchemes": {
      "sessionCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "mindflow_session"
      }
    },
    "schemas": {
      "Error": {
        "type": "object",
        "required": [
          "code",
          "message",
          "requestID"
        ],
        "properties": {
          "code": {
            "type": "string"
          },
          "message": {
            "type": "string"
          },
          "requestID": {
            "type": "string"
          }
        }
      },
      "CanvasSettings": {
        "type": "object",
        "required": [
          "background",
          "gridSize",
          "snap"
        ],
        "properties": {
          "background": {
            "enum": [
              "dots",
              "plain"
            ]
          },
          "gridSize": {
            "type": "number",
            "minimum": 1,
            "maximum": 1000
          },
          "snap": {
            "type": "boolean"
          }
        }
      },
      "Element": {
        "type": "object",
        "required": [
          "id",
          "type",
          "x",
          "y",
          "width",
          "height",
          "rotation"
        ],
        "description": "Type-specific fields are additionally validated by the server: shape and colors/border for shapes; assetId for images; text/fontSize/color/align for text; points/color/penWidth for strokes. Coordinates use the element center; rotations are radians.",
        "properties": {
          "id": {
            "type": "string"
          },
          "groupId": {
            "type": "string"
          },
          "shape": {
            "type": "string"
          },
          "fill": {
            "type": "string"
          },
          "border": {
            "type": "string"
          },
          "text": {
            "type": "string"
          },
          "align": {
            "type": "string"
          },
          "color": {
            "type": "string"
          },
          "assetId": {
            "type": "string"
          },
          "x": {
            "type": "number"
          },
          "y": {
            "type": "number"
          },
          "width": {
            "type": "number"
          },
          "height": {
            "type": "number"
          },
          "rotation": {
            "type": "number"
          },
          "borderWidth": {
            "type": "number"
          },
          "fontSize": {
            "type": "number"
          },
          "penWidth": {
            "type": "number"
          },
          "type": {
            "enum": [
              "image",
              "shape",
              "text",
              "stroke"
            ]
          },
          "bold": {
            "type": "boolean"
          },
          "italic": {
            "type": "boolean"
          },
          "points": {
            "type": "array",
            "items": {
              "type": "number"
            },
            "maxItems": 40000
          }
        },
        "additionalProperties": false
      },
      "Document": {
        "type": "object",
        "required": [
          "schemaVersion",
          "elements",
          "settings"
        ],
        "properties": {
          "schemaVersion": {
            "const": 1
          },
          "elements": {
            "type": "array",
            "maxItems": 10000,
            "items": {
              "$ref": "#/components/schemas/Element"
            }
          },
          "settings": {
            "$ref": "#/components/schemas/CanvasSettings"
          }
        },
        "additionalProperties": false
      },
      "SaveRequest": {
        "type": "object",
        "required": [
          "baseRevision",
          "epoch",
          "clientId",
          "mutationId",
          "document"
        ],
        "properties": {
          "baseRevision": {
            "type": "integer"
          },
          "epoch": {
            "type": "integer"
          },
          "clientId": {
            "type": "string"
          },
          "mutationId": {
            "type": "string"
          },
          "document": {
            "$ref": "#/components/schemas/Document"
          }
        },
        "additionalProperties": false
      },
      "LeaseRequest": {
        "type": "object",
        "required": [
          "clientId",
          "action"
        ],
        "properties": {
          "clientId": {
            "type": "string"
          },
          "action": {
            "enum": [
              "acquire",
              "renew",
              "release",
              "takeover"
            ]
          },
          "epoch": {
            "type": "integer"
          }
        },
        "additionalProperties": false
      },
      "Lease": {
        "type": "object",
        "properties": {
          "editable": {
            "type": "boolean"
          },
          "epoch": {
            "type": "integer"
          },
          "expiresAt": {
            "type": "integer"
          },
          "revision": {
            "type": "integer"
          }
        }
      },
      "SMTP": {
        "type": "object",
        "properties": {
          "host": {
            "type": "string"
          },
          "username": {
            "type": "string"
          },
          "password": {
            "type": "string"
          },
          "from": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "port": {
            "type": "integer"
          },
          "mode": {
            "enum": [
              "tls",
              "starttls"
            ]
          }
        }
      },
      "Settings": {
        "type": "object",
        "required": [
          "publicURL",
          "smtp"
        ],
        "properties": {
          "publicURL": {
            "type": "string",
            "format": "uri"
          },
          "smtp": {
            "$ref": "#/components/schemas/SMTP"
          }
        }
      },
      "User": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "email": {
            "type": "string"
          },
          "status": {
            "type": "string"
          },
          "appearance": {
            "type": "string"
          },
          "role": {
            "enum": [
              "admin",
              "user"
            ]
          }
        }
      },
      "Workspace": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "revision": {
            "type": "integer"
          },
          "updatedAt": {
            "type": "integer"
          },
          "pageCount": {
            "type": "integer"
          }
        }
      },
      "Page": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "workspaceId": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "revision": {
            "type": "integer"
          },
          "metadataRevision": {
            "type": "integer"
          },
          "position": {
            "type": "integer"
          }
        }
      },
      "AssetMetadata": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "mime": {
            "type": "string"
          },
          "width": {
            "type": "integer"
          },
          "height": {
            "type": "integer"
          },
          "variants": {
            "type": "array",
            "items": {
              "type": "integer"
            }
          }
        }
      }
    }
  }
}
