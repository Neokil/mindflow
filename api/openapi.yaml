  "components": {
    "securitySchemes": {
      "sessionCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "mindflow_session"
      }
    },
    "schemas": {
      "Error": {
        "type": "object",
        "required": [
          "code",
          "message",
          "requestID"
        ],
        "properties": {
          "code": {
            "type": "string"
          },
          "message": {
            "type": "string"
          },
          "requestID": {
            "type": "string"
          }
        }
      },
      "CanvasSettings": {
        "type": "object",
        "required": [
          "background",
          "gridSize",
          "snap"
        ],
        "properties": {
          "background": {
            "enum": [
              "dots",
              "plain"
            ]
          },
          "gridSize": {
            "type": "number",
            "minimum": 1,
            "maximum": 1000
          },
          "snap": {
            "type": "boolean"
          },
          "backgroundColor": {
            "type": "string",
            "description": "Optional validated CSS color overriding the theme background; omission uses the theme."
          },
          "defaultFill": {
            "type": "string",
            "default": "#1b5e3b",
            "description": "Default fill for newly created shapes. Omission or an empty value uses the default. Existing elements and template styles are unchanged.",
            "pattern": "^$|^transparent$|^#[0-9a-fA-F]{6}([0-9a-fA-F]{2})?$"
          },
          "defaultBorder": {
            "type": "string",
            "default": "#d9a441",
            "description": "Default border for newly created shapes. Omission or an empty value uses the default. Existing elements and template styles are unchanged.",
            "pattern": "^$|^transparent$|^#[0-9a-fA-F]{6}([0-9a-fA-F]{2})?$"
          },
          "defaultTextColor": {
            "type": "string",
            "default": "#d9a441",
            "description": "Default color for newly created and pasted plain text. Omission or an empty value uses the default. Existing elements and template styles are unchanged.",
            "pattern": "^$|^transparent$|^#[0-9a-fA-F]{6}([0-9a-fA-F]{2})?$"
          }
        }
      },
      "Element": {
        "type": "object",
        "required": [
          "id",
          "type",
          "x",
          "y",
          "width",
          "height",
          "rotation"
        ],
        "description": "Type-specific fields are additionally validated by the server: shape and colors/border for shapes; assetId for images; text/fontSize/color/align for text; points/color/penWidth for strokes. Coordinates use the element center; rotations are radians. Text may use listStyle and checked line indices. PDF elements reference a protected original PDF asset with a PNG thumbnail; highlights are strokes with highlight=true.",
        "properties": {
          "id": {
            "type": "string"
          },
          "groupId": {
            "type": "string"
          },
          "shape": {
            "type": "string"
          },
          "fill": {
            "type": "string"
          },
          "border": {
            "type": "string"
          },
          "text": {
            "type": "string"
          },
          "align": {
            "type": "string"
          },
          "color": {
            "type": "string"
          },
          "assetId": {
            "type": "string"
          },
          "x": {
            "type": "number"
          },
          "y": {
            "type": "number"
          },
          "width": {
            "type": "number"
          },
          "height": {
            "type": "number"
          },
          "rotation": {
            "type": "number"
          },
          "borderWidth": {
            "type": "number"
          },
          "fontSize": {
            "type": "number"
          },
          "penWidth": {
            "type": "number"
          },
          "type": {
            "enum": [
              "image",
              "shape",
              "text",
              "stroke",
              "pdf"
            ]
          },
          "bold": {
            "type": "boolean"
          },
          "italic": {
            "type": "boolean"
          },
          "points": {
            "type": "array",
            "items": {
              "type": "number"
            },
            "maxItems": 40000
          },
          "locked": {
            "type": "boolean",
            "default": false,
            "description": "Group lock safeguard. Requires groupId; all group members have the same lock state."
          },
          "highlight": {
            "type": "boolean",
            "description": "Translucent multiply-blended marker stroke; supported only on strokes."
          },
          "listStyle": {
            "enum": [
              "bullet",
              "number",
              "check"
            ]
          },
          "checked": {
            "type": "array",
            "maxItems": 1000,
            "uniqueItems": true,
            "items": {
              "type": "integer",
              "minimum": 0,
              "maximum": 999
            },
            "description": "Zero-based checked line indices, only for checklist text."
          }
        },
        "additionalProperties": false
      },
      "Document": {
        "type": "object",
        "required": [
          "schemaVersion",
          "elements",
          "settings"
        ],
        "properties": {
          "schemaVersion": {
            "const": 1
          },
          "elements": {
            "type": "array",
            "maxItems": 10000,
            "items": {
              "$ref": "#/components/schemas/Element"
            }
          },
          "settings": {
            "$ref": "#/components/schemas/CanvasSettings"
          }
        },
        "additionalProperties": false
      },
      "SaveRequest": {
        "type": "object",
        "required": [
          "baseRevision",
          "epoch",
          "clientId",
          "mutationId",
          "document"
        ],
        "properties": {
          "baseRevision": {
            "type": "integer"
          },
          "epoch": {
            "type": "integer"
          },
          "clientId": {
            "type": "string"
          },
          "mutationId": {
            "type": "string"
          },
          "document": {
            "$ref": "#/components/schemas/Document"
          }
        },
        "additionalProperties": false
      },
      "LeaseRequest": {
        "type": "object",
        "required": [
          "clientId",
          "action"
        ],
        "properties": {
          "clientId": {
            "type": "string"
          },
          "action": {
            "enum": [
              "acquire",
              "renew",
              "release",
              "takeover",
              "accept",
              "deny",
              "cancel",
              "force"
            ]
          },
          "epoch": {
            "type": "integer"
          },
          "requestId": {
            "type": "string",
            "description": "Required when accepting, denying or cancelling a pending request."
          }
        },
        "additionalProperties": false
      },
      "Lease": {
        "type": "object",
        "properties": {
          "editable": {
            "type": "boolean"
          },
          "epoch": {
            "type": "integer"
          },
          "expiresAt": {
            "type": "integer"
          },
          "revision": {
            "type": "integer"
          },
          "request": {
            "$ref": "#/components/schemas/ControlRequest"
          }
        }
      },
      "SMTP": {
        "type": "object",
        "properties": {
          "host": {
            "type": "string"
          },
          "username": {
            "type": "string"
          },
          "password": {
            "type": "string"
          },
          "from": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "port": {
            "type": "integer"
          },
          "mode": {
            "enum": [
              "tls",
              "starttls"
            ]
          }
        }
      },
      "Settings": {
        "type": "object",
        "required": [
          "publicURL",
          "smtp"
        ],
        "properties": {
          "publicURL": {
            "type": "string",
            "format": "uri"
          },
          "smtp": {
            "$ref": "#/components/schemas/SMTP"
          }
        }
      },
      "User": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "email": {
            "type": "string"
          },
          "status": {
            "type": "string"
          },
          "appearance": {
            "type": "string"
          },
          "role": {
            "enum": [
              "admin",
              "user"
            ]
          },
          "avatarVersion": {
            "type": "string",
            "description": "Changes when the profile PNG is replaced; empty means initials."
          },
          "displayName": {
            "type": "string",
            "minLength": 1,
            "maxLength": 80,
            "description": "Public single-line display name. Names need not be unique."
          }
        }
      },
      "Workspace": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "revision": {
            "type": "integer"
          },
          "updatedAt": {
            "type": "integer"
          },
          "pageCount": {
            "type": "integer"
          }
        }
      },
      "Page": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "workspaceId": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "revision": {
            "type": "integer"
          },
          "metadataRevision": {
            "type": "integer"
          },
          "position": {
            "type": "integer"
          }
        }
      },
      "AssetMetadata": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "mime": {
            "type": "string"
          },
          "width": {
            "type": "integer"
          },
          "height": {
            "type": "integer"
          },
          "variants": {
            "type": "array",
            "items": {
              "type": "integer"
            }
          }
        }
      },
      "ControlRequest": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "requesterEmail": {
            "type": "string"
          },
          "deadline": {
            "type": "integer"
          },
          "serverNow": {
            "type": "integer"
          },
          "status": {
            "type": "string"
          },
          "incoming": {
            "type": "boolean"
          },
          "requesterId": {
            "type": "string"
          },
          "avatarVersion": {
            "type": "string"
          },
          "requesterDisplayName": {
            "type": "string"
          }
        }
      },
      "ButterflyImportResult": {
        "type": "object",
        "required": [
          "id",
          "pageId",
          "pageCount",
          "elementCount",
          "warnings"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "pageId": {
            "type": "string"
          },
          "pageCount": {
            "type": "integer",
            "minimum": 1,
            "maximum": 100
          },
          "elementCount": {
            "type": "integer",
            "minimum": 0
          },
          "warnings": {
            "type": "array",
            "items": {
              "type": "string"
            }
          }
        }
      },
      "TemplateSummary": {
        "type": "object",
        "required": [
          "id",
          "name",
          "elementCount"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200
          },
          "elementCount": {
            "type": "integer",
            "minimum": 1,
            "maximum": 500
          }
        }
      },
      "Template": {
        "type": "object",
        "required": [
          "id",
          "name",
          "elementCount",
          "elements"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200
          },
          "elementCount": {
            "type": "integer",
            "minimum": 1,
            "maximum": 500
          },
          "elements": {
            "type": "array",
            "minItems": 1,
            "maxItems": 500,
            "items": {
              "$ref": "#/components/schemas/Element"
            }
          }
        }
      },
      "DirectoryUser": {
        "type": "object",
        "required": [
          "id",
          "displayName",
          "avatarVersion"
        ],
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string"
          },
          "displayName": {
            "type": "string",
            "minLength": 1,
            "maxLength": 80,
            "description": "Public single-line display name. Names need not be unique."
          },
          "avatarVersion": {
            "type": "string"
          }
        },
        "description": "Active public profile. No email addresses, roles, statuses, or credentials."
      },
      "ExportSelection": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "pageIds": {
            "type": "array",
            "maxItems": 100,
            "uniqueItems": true,
            "items": {
              "type": "string"
            },
            "description": "Empty or omitted means all pages. Selected pages follow workspace order."
          },
          "includeTemplates": {
            "type": "boolean",
            "default": false
          }
        }
      },
      "NativeImportResult": {
        "type": "object",
        "required": [
          "id",
          "pageId",
          "pageCount",
          "elementCount",
          "templateCount",
          "warnings"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "pageId": {
            "type": "string"
          },
          "pageCount": {
            "type": "integer",
            "minimum": 0
          },
          "elementCount": {
            "type": "integer",
            "minimum": 0
          },
          "templateCount": {
            "type": "integer",
            "minimum": 0
          },
          "warnings": {
            "type": "array",
            "items": {
              "type": "string"
            }
          }
        }
      },
      "ExportSnapshot": {
        "type": "object",
        "required": [
          "name",
          "pages"
        ],
        "properties": {
          "name": {
            "type": "string"
          },
          "pages": {
            "type": "array",
            "maxItems": 100,
            "items": {
              "type": "object",
              "required": [
                "name",
                "document"
              ],
              "properties": {
                "name": {
                  "type": "string"
                },
                "document": {
                  "$ref": "#/components/schemas/Document"
                }
              }
            }
          }
        }
      }
    }
  }
}
